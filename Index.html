<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Con tanto amore per te ✨</title>


<style>

@font-face{

font-family:Amapola;

src:url("fonts/CS-Amapola.ttf");

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


html,body{

width:100%;
height:100%;

overflow:hidden;

}


body{

background:#020617;

font-family:Amapola,serif;

}



/* ESCENA */


.escena{

width:100vw;

height:100vh;

position:relative;

overflow:hidden;


background:

radial-gradient(
circle at center,
#172554,
#020617 75%
);


}



/* ESTRELLAS */


.estrella{

position:absolute;

background:white;

border-radius:50%;

animation:

titilar 3s infinite,
flotar 20s linear infinite;


}



@keyframes titilar{


50%{

opacity:.2;

transform:scale(1.8);

}


}



@keyframes flotar{


from{

transform:translateY(0);

}


to{

transform:translateY(-120vh);

}


}




/* LUCIERNAGAS */


.luciernaga{


position:absolute;


width:8px;

height:8px;


border-radius:50%;


background:#fde047;


box-shadow:

0 0 10px #fde047,
0 0 25px #facc15;


animation:

mover 10s infinite;


}



@keyframes mover{


0%{

transform:translate(0,0);

opacity:0;

}


30%{

opacity:1;

}



100%{

transform:

translate(100px,-250px);


opacity:0;

}


}




/* CONTENIDO */


.contenido{


position:absolute;


top:50%;

left:50%;


transform:

translate(-50%,-50%);


width:90%;


text-align:center;


color:white;


}



h1{


font-size:

clamp(35px,9vw,55px);


text-shadow:


0 0 15px white,

0 0 35px #60a5fa;


animation:

entrada 3s;


}



p{


margin-top:25px;


font-size:

clamp(18px,5vw,25px);


color:#dbeafe;


}




button{


margin-top:45px;


padding:

16px 40px;


border-radius:50px;


border:

1px solid white;


background:

rgba(255,255,255,.15);


backdrop-filter:blur(10px);


box-shadow:


0 0 30px white;


}



button a{


text-decoration:none;


color:white;


font-size:20px;


font-family:Amapola;


}




@keyframes entrada{


from{

opacity:0;

transform:

scale(.5);

}


to{

opacity:1;

transform:

scale(1);

}


}



</style>


</head>



<body>



<div class="escena" id="cielo">



<div class="contenido">


<h1>

✦ Una pequeña muestra de mi cariño hacia ti 🫂 ✦

</h1>


<p>

Espero te guste este sencillo detalle 🌻

</p>



<button>

<a href="flores.html">

Clic aqui, per favore 🫶

</a>

</button>


</div>



</div>




<script>


// estrellas


for(let i=0;i<180;i++){


let e=document.createElement("span");


e.className="estrella";


let tamaño=Math.random()*3+1;


e.style.width=tamaño+"px";

e.style.height=tamaño+"px";


e.style.left=Math.random()*100+"%";


e.style.top=Math.random()*100+"%";


e.style.animationDelay=

Math.random()*5+"s";


document
.getElementById("cielo")
.appendChild(e);


}




// luciernagas


for(let i=0;i<30;i++){


let l=document.createElement("span");


l.className="luciernaga";


l.style.left=Math.random()*100+"%";


l.style.top=Math.random()*100+"%";


l.style.animationDelay=

Math.random()*8+"s";


document
.getElementById("cielo")
.appendChild(l);


}



</script>


</body>

</html>
