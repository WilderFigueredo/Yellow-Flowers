<style>
#botonContinuar{
    position:fixed;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;
}

#botonContinuar a{
    display:block;
    padding:15px 45px;
    color:white;
    text-decoration:none;
    border-radius:50px;
    border:1px solid white;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    box-shadow:0 0 25px white;
    font-family:Georgia,serif;
    font-size:20px;
}

.petalo-extra{
    position:fixed;
    top:-30px;
    width:14px;
    height:20px;
    background:#facc15;
    border-radius:50% 0 50% 0;
    animation:caerExtra 8s linear infinite;
    z-index:20;
}

@keyframes caerExtra{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

@media(max-width:600px){
    .flowers{
        transform:scale(1.15);
        transform-origin:center bottom;
    }
}
</style>

<script>
for(let i=0;i<40;i++){
    let p=document.createElement("span");
    p.className="petalo-extra";
    p.style.left=Math.random()*100+"%";
    p.style.animationDelay=Math.random()*8+"s";
    document.body.appendChild(p);
}
</script>
<script>
const musica = document.getElementById("musica");

const iniciarMusica = () => {
    if (!musica) return;
    musica.volume = 0.5;
    musica.play().catch(() => {
        // El navegador puede bloquear autoplay hasta la primera interacción del usuario.
    });
};

document.addEventListener("DOMContentLoaded", iniciarMusica);
document.addEventListener("click", iniciarMusica, { once: true });
document.addEventListener("touchstart", iniciarMusica, { once: true });
</script>
